<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأمن السيبراني - كلية اليرموك الجامعة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .cyber-glow { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .cyber-border { border: 1px solid rgba(0, 242, 254, 0.2); }
        .cyber-bg { background: linear-gradient(135deg, #161b22 0%, #0d1117 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="cyber-bg cyber-border cyber-glow w-full max-w-md p-8 rounded-2xl text-center space-y-6">
            <div class="inline-block p-4 rounded-full bg-cyan-500/10 text-cyan-400 mb-2">
                <i class="fa-solid fa-user-shield text-5xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-white">كلية اليرموك الجامعة</h1>
                <p class="text-cyan-400 text-sm mt-1 font-bold">قسم الأمن السيبراني - المرحلة الثالثة</p>
            </div>
            <div class="space-y-4 text-right">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم الطالب / المستخدم</label>
                    <input type="text" id="usernameInput" placeholder="أدخل اسمك هنا..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400 transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">رمز الدخول</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-3 rounded-lg shadow-lg transition duration-200">
                    <i class="fa-solid fa-right-to-bracket ml-2"></i> دخول المنصة
                </button>
            </div>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="appSection" class="hidden flex-1 flex flex-col">
        <!-- الهيدر -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-shield-halved text-cyan-400 text-2xl"></i>
                    <div>
                        <h2 class="font-bold text-white leading-none">الأمن السيبراني</h2>
                        <span class="text-xs text-gray-400">المرحلة الثالثة</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="userGreeting" class="text-cyan-40
